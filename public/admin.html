<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLAM MODE — Admin</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap");
      :root { --ink:#171717; --paper:#f3f1ea; --orange:#f2532b; --line:#d8d4ca; --muted:#777; }
      * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--paper); font-family:"Space Grotesk",sans-serif; } button,input,textarea,select { font:inherit; } button { cursor:pointer; }
      header { padding:22px 5vw; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; } .logo { text-decoration:none; color:var(--ink); font-size:27px; font-weight:700; letter-spacing:-.09em; } .back { color:var(--ink); font:11px "DM Mono",monospace; text-transform:uppercase; }
      main { max-width:1400px; margin:auto; padding:60px 5vw; } .top { display:flex; justify-content:space-between; align-items:end; gap:20px; margin-bottom:40px; } .eyebrow { font:11px "DM Mono",monospace; text-transform:uppercase; letter-spacing:.14em; margin:0 0 15px; } h1 { font-size:clamp(45px,7vw,90px); letter-spacing:-.1em; line-height:.85; margin:0; } .primary { background:var(--ink); color:white; border:0; padding:14px 19px; font:11px "DM Mono",monospace; text-transform:uppercase; } .primary:hover { background:var(--orange); }
      .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:35px; } .stat { border:1px solid var(--line); padding:20px; } .stat strong { display:block; font-size:35px; letter-spacing:-.08em; } .stat span { color:var(--muted); font:10px "DM Mono",monospace; text-transform:uppercase; }
      .workspace { display:grid; grid-template-columns:1.5fr 1fr; gap:40px; align-items:start; } .panel { border-top:2px solid var(--ink); padding-top:15px; } h2 { font-size:25px; letter-spacing:-.06em; margin:0 0 18px; } .product-row { display:grid; grid-template-columns:58px 1fr auto; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); } .product-row img { width:58px; height:68px; object-fit:cover; } .product-row strong { display:block; font-size:14px; } .product-row small { display:block; color:var(--muted); font:10px "DM Mono",monospace; margin-top:4px; text-transform:uppercase; } .row-actions { display:flex; gap:8px; } .row-actions button { border:1px solid var(--line); background:transparent; padding:8px; font:10px "DM Mono",monospace; } .row-actions button:hover { border-color:var(--ink); background:var(--ink); color:white; }
      form { display:grid; gap:12px; } label { font:10px "DM Mono",monospace; text-transform:uppercase; } input,textarea,select { width:100%; border:1px solid var(--line); background:#faf9f4; padding:12px; margin-top:5px; outline:none; } input:focus,textarea:focus,select:focus { border-color:var(--ink); } textarea { min-height:80px; resize:vertical; } .form-actions { display:flex; gap:10px; margin-top:5px; } .secondary { background:transparent; border:1px solid var(--ink); padding:13px 18px; font:11px "DM Mono",monospace; text-transform:uppercase; } .secondary:hover { background:var(--ink); color:white; } .orders { margin-top:55px; } .order { display:flex; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); padding:14px 0; font-size:13px; } .order small { display:block; color:var(--muted); font:10px "DM Mono",monospace; margin-top:5px; } .pill { background:var(--orange); padding:6px 8px; font:10px "DM Mono",monospace; text-transform:uppercase; height:max-content; }
      @media(max-width:800px) { main { padding:40px 20px; } .top { display:block; } .top .primary { margin-top:25px; } .workspace { grid-template-columns:1fr; gap:50px; } .stats { gap:7px; } .stat { padding:13px 10px; } .stat strong { font-size:26px; } .product-row { grid-template-columns:45px 1fr; } .product-row img { width:45px; height:55px; } .row-actions { grid-column:2; } }
    </style>
  </head>
  <body>
    <header><a class="logo" href="/">FLAM<span style="color:var(--orange)">.</span></a><a class="back" href="/">← Back to storefront</a></header>
    <main>
      <div class="top"><div><p class="eyebrow">FLAM MODE / Control room</p><h1>RUN<br /><i>THE HEAT.</i></h1></div><button class="primary" onclick="resetForm()">+ Add product</button></div>
      <div class="stats"><div class="stat"><strong id="product-count">—</strong><span>Live products</span></div><div class="stat"><strong id="stock-count">—</strong><span>Units in stock</span></div><div class="stat"><strong id="order-count">—</strong><span>Orders received</span></div></div>
      <div class="workspace">
        <section class="panel"><h2>Collection</h2><div id="product-list">Loading...</div></section>
        <section class="panel"><h2 id="form-title">Add a product</h2><form id="product-form">
          <input type="hidden" id="product-id" />
          <label>Name<input id="name" required placeholder="e.g. Solar Flare Tee" /></label>
          <label>Category<input id="category" required placeholder="e.g. T-shirts" /></label>
          <label>Price (£)<input id="price" type="number" min="0" step=".01" required placeholder="38" /></label>
          <label>Stock<input id="stock" type="number" min="0" step="1" required placeholder="20" /></label>
          <label>Image URL<input id="image" type="url" required placeholder="https://..." /></label>
          <label>Badge<input id="badge" placeholder="New / Limited / Bestseller" /></label>
          <label>Description<textarea id="description" placeholder="A short product description"></textarea></label>
          <div class="form-actions"><button class="primary" type="submit">Save product</button><button class="secondary" type="button" onclick="resetForm()">Clear</button></div>
        </form></section>
      </div>
      <section class="panel orders"><h2>Recent orders</h2><div id="order-list">Loading...</div></section>
    </main>
    <script>
      let products = [];
      const $ = (id) => document.querySelector(id);
      const money = (value) => `£${Number(value).toFixed(2)}`;
      async function api(path, options) { const response = await fetch(path, options); const data = await response.json(); if (!response.ok) throw new Error(data.error || "Something went wrong"); return data; }
      async function load() {
        const [productData, orderData] = await Promise.all([api("/api/products"), api("/api/orders")]);
        products = productData.products;
        $("#product-count").textContent = products.length; $("#stock-count").textContent = products.reduce((sum, p) => sum + p.stock, 0); $("#order-count").textContent = orderData.orders.length;
        $("#product-list").innerHTML = products.length ? products.map((p) => `<div class="product-row"><img src="${p.image}" alt="" /><div><strong>${p.name}</strong><small>${p.category} · ${money(p.price)} · ${p.stock} in stock</small></div><div class="row-actions"><button onclick="editProduct('${p.id}')">Edit</button><button onclick="deleteProduct('${p.id}')">Delete</button></div></div>`).join("") : "<p>No products yet.</p>";
        $("#order-list").innerHTML = orderData.orders.length ? orderData.orders.slice(0, 8).map((o) => `<div class="order"><div><strong>${o.id}</strong><small>${o.customer?.email || "Guest"} · ${new Date(o.createdAt).toLocaleString()}</small></div><div><strong>${money(o.total)}</strong><small>${o.items.length} item(s)</small></div><span class="pill">${o.status}</span></div>`).join("") : '<p style="color:var(--muted)">No orders yet — they will appear here after checkout.</p>';
      }
      function editProduct(id) {
        const p = products.find((item) => item.id === id); if (!p) return;
        $("#form-title").textContent = "Edit product"; ["id","name","category","price","stock","image","badge","description"].forEach((key) => { const el = $(`#${key === "id" ? "product-id" : key}`); el.value = p[key] ?? ""; }); window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function resetForm() { $("#product-form").reset(); $("#product-id").value = ""; $("#form-title").textContent = "Add a product"; }
      async function deleteProduct(id) { if (!confirm("Delete this product from the collection?")) return; await api(`/api/products/${encodeURIComponent(id)}`, { method:"DELETE" }); load(); }
      $("#product-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const id = $("#product-id").value;
        const payload = { name:$("#name").value, category:$("#category").value, price:$("#price").value, stock:$("#stock").value, image:$("#image").value, badge:$("#badge").value, description:$("#description").value };
        await api(id ? `/api/products/${encodeURIComponent(id)}` : "/api/products", { method:id ? "PUT" : "POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) }); resetForm(); load();
      });
      load().catch((error) => { $("#product-list").textContent = error.message; });
    </script>
  </body>
</html>
